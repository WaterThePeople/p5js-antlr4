<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>p5.js User Input Runner</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/addons/p5.dom.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        text-align: center;
        display: flex;
        flex-direction: row;
      }

      #editor-container {
        margin: 20px auto;
        width: 520px;
        text-align: center;
      }

      textarea {
        font-family: monospace;
        font-size: 14px;
        margin-bottom: 10px;
        width: 500px;
        height: 120px;
        resize: none;
        display: block;
        margin: 0 auto 10px auto;
      }

      button {
        font-size: 16px;
        padding: 8px 20px;
        cursor: pointer;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="editor-container"></div>

    <script src="sketch.js"></script>
  </body>
</html>
